name: Build Cloud Image-to-Video App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Restore signing key cache
        uses: actions/cache@v4
        with:
          path: release.keystore
          key: img2video-signing-key-v1

      - name: Create signing key if missing
        run: |
          if [ ! -f release.keystore ]; then
            keytool -genkeypair -keystore release.keystore -storepass android123 -keypass android123 -alias key0 -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Img2Video"
          fi

      - name: Create project files
        run: |
          mkdir -p app-project/app/src/main/java/com/img2video/app
          mkdir -p app-project/app/src/main/res/values

          cat > app-project/settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Img2Video"
          include ':app'
          EOF

          cat > app-project/build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          EOF

          cat > app-project/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > app-project/app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.img2video.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'com.img2video.app'
                  minSdk 29
                  targetSdk 34
                  versionCode 2
                  versionName '2.0'
              }

              signingConfigs {
                  stable {
                      storeFile file(System.getenv('GITHUB_WORKSPACE') + '/release.keystore')
                      storePassword 'android123'
                      keyAlias 'key0'
                      keyPassword 'android123'
                  }
              }

              buildTypes {
                  debug {
                      signingConfig signingConfigs.stable
                  }
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          tasks.withType(JavaCompile) {
              options.encoding = 'UTF-8'
          }
          EOF

          cat > app-project/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@android:drawable/ic_media_play"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:supportsRtl="true"
                  android:allowBackup="false"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app-project/app/src/main/res/values/strings.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">صورة إلى فيديو</string>
          </resources>
          EOF

          cat > app-project/app/src/main/java/com/img2video/app/MainActivity.java <<'EOF'
          package com.img2video.app;

          import android.app.Activity;
          import android.app.AlertDialog;
          import android.content.ContentValues;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.content.res.ColorStateList;
          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Matrix;
          import android.graphics.drawable.GradientDrawable;
          import android.media.ExifInterface;
          import android.net.Uri;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.provider.MediaStore;
          import android.text.InputType;
          import android.view.Gravity;
          import android.view.View;
          import android.view.ViewGroup;
          import android.widget.AdapterView;
          import android.widget.ArrayAdapter;
          import android.widget.Button;
          import android.widget.EditText;
          import android.widget.FrameLayout;
          import android.widget.HorizontalScrollView;
          import android.widget.ImageView;
          import android.widget.LinearLayout;
          import android.widget.ProgressBar;
          import android.widget.ScrollView;
          import android.widget.SeekBar;
          import android.widget.Spinner;
          import android.widget.TextView;
          import android.widget.Toast;
          import android.widget.VideoView;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private static final int MATCH = ViewGroup.LayoutParams.MATCH_PARENT;
              private static final int WRAP = ViewGroup.LayoutParams.WRAP_CONTENT;
              private static final int REQ_PICK = 1;
              private static final String DEFAULT_PROMPT = "make this image come alive, cinematic motion, smooth animation";

              // Built-in list: Space id, title, description (statuses were not re-checked today)
              private static final String[][] BUILTIN = {
                      {"zerogpu-aoti/wan2-2-fp8da-aoti-faster", "Wan 2.2 14B Fast", "الأكثر استخدامًا وسرعة (موصى به)"},
                      {"r3gm/wan2-2-fp8da-aoti-preview", "Wan 2.2 14B Preview", "نسخة معاينة من Wan 2.2"},
                      {"dream2589632147/Dream-wan2-2-faster-Pro", "Dream Wan 2.2 Pro", "حركة سينمائية بنموذج Wan 2.2"},
                      {"venom2672/wan22-i2v-demo", "Wan 2.2 Lightning", "عرض سريع بنموذج Wan 2.2"},
                      {"multimodalart/LongCat-Video", "LongCat Video", "فيديو من صورة أو نص"},
                      {"FrameAI4687/Omni-Video-Factory", "Omni Video Factory", "نص أو صورة إلى فيديو"},
                      {"akhaliq/Ovi", "Ovi", "فيديو مع صوت من صورة"},
