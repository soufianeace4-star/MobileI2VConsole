          package com.img2video.app;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.io.OutputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.net.UnknownHostException;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;

          /** Talks to any Gradio Space that accepts an image and returns a video. */
          final class GradioClient {

              interface Listener {
                  void onStatus(String s);
              }

              static final class Param {
                  String label = "";
                  String name = "";
                  String component = "";
                  boolean hasDefault;
                  Object def;
                  Object example;
              }

              static final class Endpoint {
                  String name;
                  final List<Param> params = new ArrayList<>();
                  boolean returnsVideo;
              }

              private static final String[] PREFIXES = {"/gradio_api", ""};

              final String host;
              private final String token;
              private String prefix = "/gradio_api";
              private Endpoint endpoint;

              GradioClient(String spaceId, String token) {
                  this.host = hostFor(spaceId);
                  this.token = token;
              }

              static String hostFor(String spaceId) {
                  String s = spaceId.trim().toLowerCase(Locale.ROOT);
                  s = s.replace("/", "-").replace("_", "-").replace(".", "-");
                  return "https://" + s + ".hf.space";
              }

              // ---------------------------------------------------------------- HTTP helpers

              private HttpURLConnection open(String url, String method) throws IOException {
                  HttpURLConnection c = (HttpURLConnection) new URL(url).openConnection();
                  c.setRequestMethod(method);
                  c.setConnectTimeout(30000);
                  c.setReadTimeout(120000);
                  c.setRequestProperty("User-Agent", "Img2VideoApp/2.0");
                  if (token != null && !token.isEmpty() && url.startsWith(host)) {
                      c.setRequestProperty("Authorization", "Bearer " + token);
                  }
                  return c;
              }

              private static String readAll(InputStream in) throws IOException {
                  if (in == null) return "";
                  ByteArrayOutputStream bo = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) bo.write(buf, 0, n);
                  return new String(bo.toByteArray(), StandardCharsets.UTF_8);
              }

              private static void copy(InputStream in, OutputStream out) throws IOException {
                  byte[] buf = new byte[16384];
                  int n;
                  while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
              }

              private static String clip(String s) {
                  return s.length() > 300 ? s.substring(0, 300) : s;
              }

              // ---------------------------------------------------------------- API description

              void loadEndpoint(Listener l) throws Exception {
                  JSONObject info = null;
                  for (int attempt = 0; attempt < 7 && info == null; attempt++) {
                      if (attempt > 0) {
                          l.onStatus("الـ Space يستيقظ أو يبدأ التشغيل... محاولة " + (attempt + 1));
                          Thread.sleep(10000);
                      }
                      for (String p : PREFIXES) {
                          int code = -1;
                          String text = "";
                          try {
                              HttpURLConnection c = open(host + p + "/info", "GET");
                              code = c.getResponseCode();
                              text = readAll(code >= 400 ? c.getErrorStream() : c.getInputStream());
                          } catch (UnknownHostException e) {
                              throw new IOException("لم أجد هذا الـ Space. تحقق من الاسم.");
                          } catch (IOException e) {
                              code = -1;
                          }
                          if (code == 200 && text.trim().startsWith("{")) {
                              info = new JSONObject(text);
                              prefix = p;
                              break;
                          }
                      }
                  }
                  if (info == null) {
                      throw new IOException("الـ Space لا يستجيب الآن (قد يكون نائمًا أو معطّلًا أو لا يستخدم Gradio). "
                              + "جرّب لاحقًا أو اختر نموذجًا آخر.");
                  }

                  JSONObject named = info.optJSONObject("named_endpoints");
                  if (named == null) throw new IOException("لم أستطع قراءة واجهة هذا الـ Space.");

                  Endpoint best = null;
                  int bestScore = -1;
                  Iterator<String> it = named.keys();
                  while (it.hasNext()) {
                      String key = it.next();
                      JSONObject ep = named.optJSONObject(key);
                      if (ep == null) continue;
                      JSONArray ps = ep.optJSONArray("parameters");
                      if (ps == null) continue;

                      Endpoint e = new Endpoint();
                      e.name = key.startsWith("/") ? key.substring(1) : key;
                      boolean hasImage = false;
                      for (int i = 0; i < ps.length(); i++) {
                          JSONObject po = ps.getJSONObject(i);
                          Param p = new Param();
                          p.label = po.optString("label", "");
                          p.name = po.optString("parameter_name", "");
                          p.component = po.optString("component", "");
                          p.hasDefault = po.optBoolean("parameter_has_default", false);
                          p.def = po.has("parameter_default") ? po.get("parameter_default") : null;
                          p.example = po.has("example_input") ? po.get("example_input") : null;
                          e.params.add(p);
                          if (p.component.equalsIgnoreCase("image")) hasImage = true;
                      }
                      JSONArray rs = ep.optJSONArray("returns");
                      if (rs != null) {
                          for (int i = 0; i < rs.length(); i++) {
                              JSONObject ro = rs.optJSONObject(i);
                              if (ro != null && ro.optString("component", "").equalsIgnoreCase("video")) {
                                  e.returnsVideo = true;
                              }
                          }
                      }
                      if (!hasImage) continue;
                      int score = 2 + (e.returnsVideo ? 3 : 0);
                      String low = e.name.toLowerCase(Locale.ROOT);
                      if (low.contains("generate") || low.contains("video")) score += 1;
                      if (score > bestScore) {
                          bestScore = score;
                          best = e;
                      }
                  }
                  if (best == null) {
                      throw new IOException("هذا الـ Space لا يقبل صورة كمدخل، فلا يصلح لهذا التطبيق.");
                  }
                  endpoint = best;
              }

              private JSONArray buildData(String uploadedPath, String prompt, double duration) throws Exception {
                  JSONArray data = new JSONArray();
                  boolean imgUsed = false;
                  boolean promptUsed = false;
                  for (Param p : endpoint.params) {
                      String lbl = (p.label + " " + p.name).toLowerCase(Locale.ROOT);
                      String comp = p.component.toLowerCase(Locale.ROOT);
                      if (comp.equals("image") && !imgUsed) {
                          JSONObject meta = new JSONObject();
                          meta.put("_type", "gradio.FileData");
                          JSONObject fd = new JSONObject();
                          fd.put("path", uploadedPath);
                          fd.put("meta", meta);
                          data.put(fd);
                          imgUsed = true;
                      } else if (comp.equals("textbox") && !lbl.contains("negative") && !promptUsed) {
                          data.put(prompt);
                          promptUsed = true;
                      } else if (comp.equals("textbox") && lbl.contains("negative") && !p.hasDefault) {
                          data.put("");
                      } else if (lbl.contains("duration")) {
                          data.put(duration);
                      } else if (comp.equals("checkbox") && lbl.contains("random")) {
                          data.put(true);
                      } else if (p.hasDefault) {
                          data.put(p.def == null ? JSONObject.NULL : p.def);
                      } else if (p.example != null) {
                          data.put(p.example);
                      } else {
                          data.put(JSONObject.NULL);
                      }
                  }
                  return data;
              }

              // ---------------------------------------------------------------- steps

              String upload(byte[] data) throws Exception {
                  String boundary = "----i2v" + System.currentTimeMillis();
                  ByteArrayOutputStream body = new ByteArrayOutputStream();
                  body.write(("--" + boundary + "\r\n"
                          + "Content-Disposition: form-data; name=\"files\"; filename=\"image.jpg\"\r\n"
                          + "Content-Type: image/jpeg\r\n\r\n").getBytes(StandardCharsets.UTF_8));
                  body.write(data);
                  body.write(("\r\n--" + boundary + "--\r\n").getBytes(StandardCharsets.UTF_8));

                  HttpURLConnection c = open(host + prefix + "/upload", "POST");
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "multipart/form-data; boundary=" + boundary);
                  c.setFixedLengthStreamingMode(body.size());
                  try (OutputStream os = c.getOutputStream()) {
                      body.writeTo(os);
                  }
                  int code = c.getResponseCode();
                  String resp = readAll(code >= 400 ? c.getErrorStream() : c.getInputStream());
                  if (code >= 400) {
                      throw new IOException("رفع الصورة فشل (HTTP " + code + "): " + clip(resp));
                  }
                  return new JSONArray(resp).getString(0);
              }

              String submit(String uploadedPath, String prompt, double duration) throws Exception {
                  JSONObject req = new JSONObject();
                  req.put("data", buildData(uploadedPath, prompt, duration));
                  byte[] body = req.toString().getBytes(StandardCharsets.UTF_8);

                  HttpURLConnection c = open(host + prefix + "/call/" + endpoint.name, "POST");
                  c.setDoOutput(true);
                  c.setRequestProperty("Content-Type", "application/json");
                  c.setFixedLengthStreamingMode(body.length);
                  try (OutputStream os = c.getOutputStream()) {
                      os.write(body);
                  }
                  int code = c.getResponseCode();
                  String resp = readAll(code >= 400 ? c.getErrorStream() : c.getInputStream());
                  if (code >= 400) {
                      throw new IOException("طلب التوليد رُفض (HTTP " + code + "): " + clip(resp));
                  }
                  return new JSONObject(resp).getString("event_id");
              }

              String waitResult(String eventId, Listener l) throws Exception {
                  HttpURLConnection c = open(host + prefix + "/call/" + endpoint.name + "/" + eventId, "GET");
                  c.setReadTimeout(20 * 60 * 1000);
                  c.setRequestProperty("Accept", "text/event-stream");
                  int code = c.getResponseCode();
                  if (code >= 400) {
                      throw new IOException("تعذر قراءة النتيجة (HTTP " + code + "): " + clip(readAll(c.getErrorStream())));
                  }
                  BufferedReader br = new BufferedReader(new InputStreamReader(c.getInputStream(), StandardCharsets.UTF_8));
                  String line;
                  String event = null;
                  while ((line = br.readLine()) != null) {
                      if (line.startsWith("event:")) {
                          event = line.substring(6).trim();
                          if (!"complete".equals(event) && !"error".equals(event)) {
                              l.onStatus("النموذج يعمل الآن... (قد يستغرق دقيقة أو أكثر)");
                          }
                      } else if (line.startsWith("data:")) {
                          String d = line.substring(5).trim();
                          if ("complete".equals(event)) return d;
                          if ("error".equals(event)) {
                              String low = d.toLowerCase(Locale.ROOT);
                              if (low.contains("quota")) {
                                  throw new IOException("انتهت حصتك المجانية من هذه الخدمة. أضف مفتاح Hugging Face "
                                          + "في الإعدادات المتقدمة، أو جرّب لاحقًا، أو اختر نموذجًا آخر.\n" + clip(d));
                              }
                              if (d.equals("null") || d.isEmpty()) {
                                  throw new IOException("النموذج أعاد خطأ دون تفاصيل. قد تكون الخدمة مشغولة "
                                          + "أو الحصة المجانية انتهت، أو أن هذا النموذج يحتاج مدخلات لا يدعمها التطبيق.");
                              }
                              throw new IOException("النموذج أعاد خطأ: " + clip(d));
                          }
                      }
                  }
                  throw new IOException("انتهى الاتصال دون نتيجة.");
              }

              String extractVideoUrl(String data) throws Exception {
                  JSONArray res = new JSONArray(data);
                  String fallback = null;
                  for (int i = 0; i < res.length(); i++) {
                      String u = urlFrom(res.get(i));
                      if (u == null) continue;
                      String low = u.toLowerCase(Locale.ROOT);
                      if (low.contains(".mp4") || low.contains(".webm") || low.contains(".mov")) return u;
                      if (fallback == null) fallback = u;
                  }
                  if (fallback != null) return fallback;
                  throw new IOException("لم أجد فيديو في النتيجة: " + clip(data));
              }

              private String urlFrom(Object o) {
                  try {
                      if (o instanceof JSONObject) {
                          JSONObject j = (JSONObject) o;
                          if (j.has("video") && !j.isNull("video")) return urlFrom(j.get("video"));
                          String url = j.isNull("url") ? "" : j.optString("url", "");
                          if (!url.isEmpty() && !url.equals("null")) return url;
                          String path = j.isNull("path") ? "" : j.optString("path", "");
                          if (!path.isEmpty() && !path.equals("null")) return host + prefix + "/file=" + path;
                      } else if (o instanceof String) {
                          String s = (String) o;
                          if (s.startsWith("http")) return s;
                          if (s.startsWith("/")) return host + prefix + "/file=" + s;
                      }
                  } catch (Exception ignored) {
                      // fall through
                  }
                  return null;
              }

              File download(String url, File out) throws Exception {
                  HttpURLConnection c = open(url, "GET");
                  c.setReadTimeout(180000);
                  int code = c.getResponseCode();
                  if (code >= 400) {
                      throw new IOException("تنزيل الفيديو فشل (HTTP " + code + ")");
                  }
                  try (InputStream in = c.getInputStream(); FileOutputStream fo = new FileOutputStream(out)) {
                      copy(in, fo);
                  }
                  return out;
              }
          }
