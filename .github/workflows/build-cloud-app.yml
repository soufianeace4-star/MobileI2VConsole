                  ScrollView sv = new ScrollView(this);
                  sv.setBackgroundColor(Ui.BG);
                  sv.setLayoutDirection(View.LAYOUT_DIRECTION_RTL);
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  sv.addView(root, new ViewGroup.LayoutParams(MATCH, WRAP));

                  // ---- header
                  LinearLayout header = new LinearLayout(this);
                  header.setOrientation(LinearLayout.VERTICAL);
                  GradientDrawable hg = new GradientDrawable(GradientDrawable.Orientation.TL_BR,
                          new int[]{0xFF4F46E5, 0xFF8B5CF6});
                  float r = Ui.dp(this, 28);
                  hg.setCornerRadii(new float[]{0, 0, 0, 0, r, r, r, r});
                  header.setBackground(hg);
                  header.setPadding(Ui.dp(this, 24), Ui.dp(this, 52), Ui.dp(this, 24), Ui.dp(this, 28));
                  header.addView(Ui.text(this, "🎬 صورة إلى فيديو", 28, 0xFFFFFFFF, true));
                  header.addView(Ui.text(this, "حوّل أي صورة إلى فيديو قصير بالذكاء الاصطناعي عبر نماذج مجانية",
                          14, 0xCCFFFFFF, false), Ui.lp(this, WRAP, WRAP, 6));
                  root.addView(header, new LinearLayout.LayoutParams(MATCH, WRAP));

                  LinearLayout content = new LinearLayout(this);
                  content.setOrientation(LinearLayout.VERTICAL);
                  content.setPadding(Ui.dp(this, 16), Ui.dp(this, 4), Ui.dp(this, 16), Ui.dp(this, 32));
                  root.addView(content, new LinearLayout.LayoutParams(MATCH, WRAP));

                  // ---- card 1: image
                  LinearLayout c1 = Ui.card(this);
                  c1.addView(Ui.text(this, "١  اختر الصورة", 16, Ui.TEXT, true));
                  FrameLayout box = new FrameLayout(this);
                  GradientDrawable dash = Ui.rect(this, 0xFFFAFAFF, 14);
                  dash.setStroke(Ui.dp(this, 2), 0xFFB9BCE8, Ui.dp(this, 8), Ui.dp(this, 6));
                  box.setBackground(dash);
                  placeholder = new LinearLayout(this);
                  placeholder.setOrientation(LinearLayout.VERTICAL);
                  placeholder.setGravity(Gravity.CENTER);
                  placeholder.addView(Ui.text(this, "🖼️", 40, Ui.TEXT, false));
                  placeholder.addView(Ui.text(this, "اضغط لاختيار صورة من المعرض", 14, Ui.MUTED, false));
                  box.addView(placeholder, new FrameLayout.LayoutParams(MATCH, MATCH));
                  preview = new ImageView(this);
                  preview.setScaleType(ImageView.ScaleType.FIT_CENTER);
                  preview.setVisibility(View.GONE);
                  box.addView(preview, new FrameLayout.LayoutParams(MATCH, MATCH));
                  Ui.clipRound(box, Ui.dp(this, 14));
                  box.setOnClickListener(v -> pickImage());
                  c1.addView(box, Ui.lp(this, MATCH, Ui.dp(this, 230), 12));
                  content.addView(c1, Ui.lp(this, MATCH, WRAP, 14));

                  // ---- card 2: model
                  LinearLayout c2 = Ui.card(this);
                  c2.addView(Ui.text(this, "٢  اختر النموذج", 16, Ui.TEXT, true));
                  modelSpinner = new Spinner(this);
                  modelSpinner.setBackground(Ui.rect(this, Ui.BG, 12, Ui.BORDER, 1));
                  modelSpinner.setPadding(Ui.dp(this, 8), 0, Ui.dp(this, 8), 0);
                  adapter = new ArrayAdapter<String>(this, android.R.layout.simple_spinner_item, titles) {
                      @Override
                      public View getView(int pos, View cv, ViewGroup parent) {
                          TextView t = (TextView) super.getView(pos, cv, parent);
                          t.setTextColor(Ui.TEXT);
                          t.setTextSize(15);
                          return t;
                      }

                      @Override
                      public View getDropDownView(int pos, View cv, ViewGroup parent) {
                          TextView t = (TextView) super.getDropDownView(pos, cv, parent);
                          t.setTextColor(Ui.TEXT);
                          t.setTextSize(15);
                          t.setPadding(Ui.dp(MainActivity.this, 16), Ui.dp(MainActivity.this, 14),
                                  Ui.dp(MainActivity.this, 16), Ui.dp(MainActivity.this, 14));
                          return t;
                      }
                  };
                  adapter.setDropDownViewResource(android.R.layout.simple_spinner_dropdown_item);
                  modelSpinner.setAdapter(adapter);
                  c2.addView(modelSpinner, Ui.lp(this, MATCH, Ui.dp(this, 52), 10));
                  modelDesc = Ui.text(this, "", 13, Ui.MUTED, false);
                  c2.addView(modelDesc, Ui.lp(this, MATCH, WRAP, 8));

                  LinearLayout row = new LinearLayout(this);
                  row.setOrientation(LinearLayout.HORIZONTAL);
                  Button addBtn = Ui.button(this, "＋ إضافة Space", Ui.CHIP, Ui.PRIMARY, 12);
                  addBtn.setTextSize(14);
                  addBtn.setOnClickListener(v -> addSpaceDialog());
                  LinearLayout.LayoutParams addLp = new LinearLayout.LayoutParams(0, Ui.dp(this, 46), 1f);
                  addLp.setMarginEnd(Ui.dp(this, 8));
                  row.addView(addBtn, addLp);
                  removeBtn = Ui.button(this, "🗑 حذف", 0xFFFDECEC, Ui.ERR, 12);
                  removeBtn.setTextSize(14);
                  removeBtn.setVisibility(View.GONE);
                  removeBtn.setOnClickListener(v -> removeSelectedSpace());
                  row.addView(removeBtn, new LinearLayout.LayoutParams(0, Ui.dp(this, 46), 1f));
                  c2.addView(row, Ui.lp(this, MATCH, WRAP, 10));
                  content.addView(c2, Ui.lp(this, MATCH, WRAP, 14));

                  // ---- card 3: motion settings
                  LinearLayout c3 = Ui.card(this);
                  c3.addView(Ui.text(this, "٣  صف الحركة", 16, Ui.TEXT, true));
                  promptEdit = new EditText(this);
                  promptEdit.setText(DEFAULT_PROMPT);
                  promptEdit.setMinLines(3);
                  promptEdit.setGravity(Gravity.TOP | Gravity.START);
                  promptEdit.setTextColor(Ui.TEXT);
                  promptEdit.setTextSize(15);
                  promptEdit.setBackground(Ui.rect(this, Ui.BG, 12, Ui.BORDER, 1));
                  promptEdit.setPadding(Ui.dp(this, 12), Ui.dp(this, 10), Ui.dp(this, 12), Ui.dp(this, 10));
                  promptEdit.setTextDirection(View.TEXT_DIRECTION_FIRST_STRONG);
                  c3.addView(promptEdit, Ui.lp(this, MATCH, WRAP, 10));

                  HorizontalScrollView hs = new HorizontalScrollView(this);
                  hs.setHorizontalScrollBarEnabled(false);
                  LinearLayout chips = new LinearLayout(this);
                  chips.setOrientation(LinearLayout.HORIZONTAL);
                  for (int i = 0; i < CHIP_LABELS.length; i++) {
                      final String p = CHIP_PROMPTS[i];
                      TextView chip = Ui.text(this, CHIP_LABELS[i], 13, Ui.PRIMARY, true);
                      chip.setBackground(Ui.rect(this, Ui.CHIP, 20));
                      chip.setPadding(Ui.dp(this, 14), Ui.dp(this, 8), Ui.dp(this, 14), Ui.dp(this, 8));
                      chip.setOnClickListener(v -> promptEdit.setText(p));
                      LinearLayout.LayoutParams cl = new LinearLayout.LayoutParams(WRAP, WRAP);
                      cl.setMarginEnd(Ui.dp(this, 8));
                      chips.addView(chip, cl);
                  }
                  hs.addView(chips);
                  c3.addView(hs, Ui.lp(this, MATCH, WRAP, 10));

                  durationLabel = Ui.text(this, durationText(10), 14, Ui.TEXT, false);
                  c3.addView(durationLabel, Ui.lp(this, MATCH, WRAP, 14));
                  durationSeek = new SeekBar(this);
                  durationSeek.setMax(30);
                  durationSeek.setProgress(10);
                  durationSeek.setProgressTintList(ColorStateList.valueOf(Ui.PRIMARY));
                  durationSeek.setThumbTintList(ColorStateList.valueOf(Ui.PRIMARY));
                  durationSeek.setOnSeekBarChangeListener(new SeekBar.OnSeekBarChangeListener() {
                      @Override
                      public void onProgressChanged(SeekBar s, int p, boolean fromUser) {
                          durationLabel.setText(durationText(p));
                      }

                      @Override
                      public void onStartTrackingTouch(SeekBar s) { }

                      @Override
                      public void onStopTrackingTouch(SeekBar s) { }
                  });
                  c3.addView(durationSeek, Ui.lp(this, MATCH, WRAP, 4));

                  // advanced
                  final LinearLayout advBox = new LinearLayout(this);
                  advBox.setOrientation(LinearLayout.VERTICAL);
                  advBox.setVisibility(View.GONE);
                  tokenEdit = new EditText(this);
                  tokenEdit.setHint("مفتاح Hugging Face (اختياري)");
                  tokenEdit.setInputType(InputType.TYPE_CLASS_TEXT | InputType.TYPE_TEXT_VARIATION_PASSWORD);
                  tokenEdit.setText(prefs.getString("token", ""));
                  tokenEdit.setTextSize(14);
                  tokenEdit.setBackground(Ui.rect(this, Ui.BG, 12, Ui.BORDER, 1));
                  tokenEdit.setPadding(Ui.dp(this, 12), Ui.dp(this, 10), Ui.dp(this, 12), Ui.dp(this, 10));
                  advBox.addView(tokenEdit, Ui.lp(this, MATCH, WRAP, 6));
                  advBox.addView(Ui.text(this, "المفتاح يزيد حصتك اليومية المجانية، ويُحفظ داخل هاتفك فقط.",
                          12, Ui.MUTED, false), Ui.lp(this, MATCH, WRAP, 4));
                  final TextView advToggle = Ui.text(this, "⚙️ إعدادات متقدمة ▾", 13, Ui.PRIMARY, true);
                  advToggle.setOnClickListener(v -> {
                      boolean show = advBox.getVisibility() != View.VISIBLE;
                      advBox.setVisibility(show ? View.VISIBLE : View.GONE);
                      advToggle.setText(show ? "⚙️ إعدادات متقدمة ▴" : "⚙️ إعدادات متقدمة ▾");
                  });
                  c3.addView(advToggle, Ui.lp(this, WRAP, WRAP, 14));
                  c3.addView(advBox, new LinearLayout.LayoutParams(MATCH, WRAP));
                  content.addView(c3, Ui.lp(this, MATCH, WRAP, 14));

                  // ---- generate button
                  genBtn = Ui.button(this, "✨ ولّد الفيديو", Ui.PRIMARY, 0xFFFFFFFF, 16);
                  genBtn.setOnClickListener(v -> generate());
                  content.addView(genBtn, Ui.lp(this, MATCH, Ui.dp(this, 58), 18));

                  // ---- status card
                  statusCard = Ui.card(this);
                  statusCard.setVisibility(View.GONE);
                  statusText = Ui.text(this, "", 14, Ui.TEXT, false);
                  statusCard.addView(statusText);
                  timerText = Ui.text(this, "00:00", 22, Ui.PRIMARY, true);
                  statusCard.addView(timerText, Ui.lp(this, WRAP, WRAP, 6));
                  progress = new ProgressBar(this, null, android.R.attr.progressBarStyleHorizontal);
                  progress.setIndeterminate(true);
                  progress.setIndeterminateTintList(ColorStateList.valueOf(Ui.PRIMARY));
                  statusCard.addView(progress, Ui.lp(this, MATCH, WRAP, 8));
                  content.addView(statusCard, Ui.lp(this, MATCH, WRAP, 14));

                  // ---- result card
                  resultCard = Ui.card(this);
                  resultCard.setVisibility(View.GONE);
                  resultCard.addView(Ui.text(this, "🎉 النتيجة", 16, Ui.TEXT, true));
                  videoView = new VideoView(this);
                  Ui.clipRound(videoView, Ui.dp(this, 14));
                  videoView.setOnClickListener(v -> {
                      if (videoView.isPlaying()) videoView.pause();
                      else videoView.start();
                  });
                  resultCard.addView(videoView, Ui.lp(this, MATCH, Ui.dp(this, 340), 10));
                  resultCard.addView(Ui.text(this, "اضغط على الفيديو للإيقاف أو التشغيل", 12, Ui.MUTED, false),
                          Ui.lp(this, WRAP, WRAP, 6));
                  LinearLayout actions = new LinearLayout(this);
                  actions.setOrientation(LinearLayout.HORIZONTAL);
                  Button saveBtn = Ui.button(this, "💾 حفظ", Ui.OK, 0xFFFFFFFF, 14);
                  saveBtn.setOnClickListener(v -> {
                      try {
                          saveToGallery();
                          toast("تم الحفظ في المعرض (Movies/Img2Video)");
                      } catch (Exception e) {
                          toast("فشل الحفظ: " + e.getMessage());
