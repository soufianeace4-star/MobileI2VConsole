              private static final String[] CHIP_LABELS = {
                      "🎥 حركة سينمائية", "🌬️ رياح وشعر", "🔍 تقريب بطيء", "😊 ابتسامة", "🌊 طبيعة حيّة"};
              private static final String[] CHIP_PROMPTS = {
                      "cinematic camera movement, smooth motion, high quality",
                      "gentle wind blowing through hair and clothes, natural motion",
                      "slow zoom in, subtle motion, cinematic",
                      "the person smiles naturally and blinks, subtle head movement",
                      "water ripples, clouds moving, leaves swaying, living nature"};

              private final ArrayList<String> ids = new ArrayList<>();
              private final ArrayList<String> titles = new ArrayList<>();
              private final ArrayList<String> descs = new ArrayList<>();
              private final Handler handler = new Handler(Looper.getMainLooper());

              private SharedPreferences prefs;
              private ArrayAdapter<String> adapter;
              private Spinner modelSpinner;
              private TextView modelDesc;
              private Button removeBtn;
              private LinearLayout placeholder;
              private ImageView preview;
