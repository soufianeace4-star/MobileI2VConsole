          package com.img2video.app;

          import android.content.Context;
          import android.content.res.ColorStateList;
          import android.graphics.Outline;
          import android.graphics.Typeface;
          import android.graphics.drawable.GradientDrawable;
          import android.graphics.drawable.RippleDrawable;
          import android.view.View;
          import android.view.ViewOutlineProvider;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          final class Ui {
              static final int BG = 0xFFF4F5FB;
              static final int PRIMARY = 0xFF5B5BD6;
              static final int TEXT = 0xFF1B1B2F;
              static final int MUTED = 0xFF6B6F85;
              static final int CARD = 0xFFFFFFFF;
              static final int BORDER = 0xFFE3E5F0;
              static final int CHIP = 0xFFEEF0FF;
              static final int OK = 0xFF1FA971;
              static final int ERR = 0xFFD64545;

              private Ui() { }

              static int dp(Context c, float v) {
                  return Math.round(v * c.getResources().getDisplayMetrics().density);
              }

              static GradientDrawable rect(Context c, int fill, float radiusDp) {
                  GradientDrawable g = new GradientDrawable();
                  g.setColor(fill);
                  g.setCornerRadius(dp(c, radiusDp));
                  return g;
              }

              static GradientDrawable rect(Context c, int fill, float radiusDp, int strokeColor, float strokeDp) {
                  GradientDrawable g = rect(c, fill, radiusDp);
                  g.setStroke(Math.max(1, dp(c, strokeDp)), strokeColor);
                  return g;
              }

              /** Layout params where w and h are in pixels and the top margin is in dp. */
              static LinearLayout.LayoutParams lp(Context c, int w, int h, float topDp) {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(w, h);
                  p.topMargin = dp(c, topDp);
                  return p;
              }

              static LinearLayout card(Context c) {
                  LinearLayout l = new LinearLayout(c);
                  l.setOrientation(LinearLayout.VERTICAL);
                  l.setBackground(rect(c, CARD, 18, BORDER, 1));
                  l.setPadding(dp(c, 16), dp(c, 16), dp(c, 16), dp(c, 16));
                  l.setElevation(dp(c, 2));
                  return l;
              }

              static TextView text(Context c, String t, float sp, int color, boolean bold) {
                  TextView v = new TextView(c);
                  v.setText(t);
                  v.setTextSize(sp);
                  v.setTextColor(color);
                  if (bold) v.setTypeface(null, Typeface.BOLD);
                  return v;
              }

              static Button button(Context c, String t, int fill, int textColor, float radiusDp) {
                  Button b = new Button(c);
                  b.setText(t);
                  b.setAllCaps(false);
                  b.setTextColor(textColor);
                  b.setTextSize(16);
                  b.setTypeface(null, Typeface.BOLD);
                  b.setStateListAnimator(null);
                  b.setBackground(new RippleDrawable(
                          ColorStateList.valueOf(0x33000000), rect(c, fill, radiusDp), null));
                  return b;
              }

              static void clipRound(View v, final float radiusPx) {
                  v.setClipToOutline(true);
                  v.setOutlineProvider(new ViewOutlineProvider() {
                      @Override
                      public void getOutline(View view, Outline outline) {
                          outline.setRoundRect(0, 0, view.getWidth(), view.getHeight(), radiusPx);
                      }
                  });
              }
          }
          EOF

      - name: Build debug APK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || true
          gradle -p app-project assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Collect APK
        run: |
          mkdir -p out
          cp app-project/app/build/outputs/apk/debug/app-debug.apk out/Img2Video.apk
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Img2Video-apk
          path: out/Img2Video.apk

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Create smoke test script
        run: |
          cat > smoke.sh <<'EOF'
          adb install -r out/Img2Video.apk
          adb logcat -c
          adb shell monkey -p com.img2video.app -c android.intent.category.LAUNCHER 1
          sleep 15
          adb logcat -d > logcat.txt
          if adb shell pidof com.img2video.app > pid.txt && [ -s pid.txt ]; then echo RUNNING > result.txt; else echo NOT_RUNNING > result.txt; fi
          if grep -q "FATAL EXCEPTION" logcat.txt; then echo CRASH >> result.txt; grep -A 25 "FATAL EXCEPTION" logcat.txt > crash.txt; fi
          adb exec-out screencap -p > screen.png
          EOF

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on emulator
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash smoke.sh

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            result.txt
            crash.txt
            pid.txt
            logcat.txt
            screen.png
