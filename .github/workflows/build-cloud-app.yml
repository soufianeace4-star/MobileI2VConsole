                  });
                  LinearLayout.LayoutParams sl = new LinearLayout.LayoutParams(0, Ui.dp(this, 50), 1f);
                  sl.setMarginEnd(Ui.dp(this, 8));
                  actions.addView(saveBtn, sl);
                  Button shareBtn = Ui.button(this, "📤 مشاركة", Ui.PRIMARY, 0xFFFFFFFF, 14);
                  shareBtn.setOnClickListener(v -> shareVideo());
                  actions.addView(shareBtn, new LinearLayout.LayoutParams(0, Ui.dp(this, 50), 1f));
                  resultCard.addView(actions, Ui.lp(this, MATCH, WRAP, 12));
                  content.addView(resultCard, Ui.lp(this, MATCH, WRAP, 14));

                  setContentView(sv);

                  modelSpinner.setOnItemSelectedListener(new AdapterView.OnItemSelectedListener() {
                      @Override
                      public void onItemSelected(AdapterView<?> parent, View view, int pos, long id) {
                          onModelSelected(pos);
                      }

                      @Override
                      public void onNothingSelected(AdapterView<?> parent) { }
                  });
                  int sel = prefs.getInt("sel", 0);
                  if (sel < 0 || sel >= ids.size()) sel = 0;
                  modelSpinner.setSelection(sel);
                  onModelSelected(sel);
              }

              private String durationText(int p) {
                  return "⏱  مدة الفيديو: " + (2.0 + p / 10.0) + " ثانية";
              }

              private void toast(String s) {
                  Toast.makeText(this, s, Toast.LENGTH_LONG).show();
              }

              // ================================================================ models

              private void loadModels() {
                  for (String[] m : BUILTIN) {
                      ids.add(m[0]);
                      titles.add(m[1]);
                      descs.add(m[2]);
                  }
                  String custom = prefs.getString("custom", "");
                  if (!custom.isEmpty()) {
                      for (String id : custom.split("\n")) {
                          String t = id.trim();
                          if (!t.isEmpty()) {
                              ids.add(t);
                              titles.add("➕ " + t);
                              descs.add("Space أضفته بنفسك");
                          }
                      }
                  }
              }

              private void saveCustom() {
                  StringBuilder sb = new StringBuilder();
                  for (int i = BUILTIN.length; i < ids.size(); i++) {
                      sb.append(ids.get(i)).append("\n");
                  }
                  prefs.edit().putString("custom", sb.toString()).apply();
              }

              private void onModelSelected(int pos) {
                  if (pos < 0 || pos >= ids.size()) return;
                  modelDesc.setText(descs.get(pos) + "\nالمصدر: huggingface.co/spaces/" + ids.get(pos));
                  removeBtn.setVisibility(pos >= BUILTIN.length ? View.VISIBLE : View.GONE);
                  prefs.edit().putInt("sel", pos).apply();
              }

              private static String normalizeSpace(String in) {
                  String s = in.trim();
                  s = s.replace("https://huggingface.co/spaces/", "").replace("http://huggingface.co/spaces/", "");
                  int q = s.indexOf('?');
                  if (q >= 0) s = s.substring(0, q);
                  while (s.endsWith("/")) s = s.substring(0, s.length() - 1);
                  String[] parts = s.split("/");
                  if (parts.length < 2 || parts[0].isEmpty() || parts[1].isEmpty() || parts[0].contains(".")) return null;
                  return parts[0] + "/" + parts[1];
              }

              private void addSpaceDialog() {
                  final EditText in = new EditText(this);
                  in.setHint("owner/space-name");
                  in.setSingleLine(true);
                  in.setTextDirection(View.TEXT_DIRECTION_LTR);
                  new AlertDialog.Builder(this)
                          .setTitle("إضافة Space من Hugging Face")
                          .setMessage("الصق اسم الـ Space (مثل owner/name) أو رابط صفحته. يجب أن يكون لتحويل "
                                  + "صورة إلى فيديو، وبواجهة Gradio.")
                          .setView(in)
                          .setPositiveButton("إضافة", (d, w) -> {
                              String id = normalizeSpace(in.getText().toString());
                              if (id == null) {
                                  toast("الاسم غير صالح. اكتب owner/name");
                                  return;
                              }
                              for (int i = 0; i < ids.size(); i++) {
                                  if (ids.get(i).equalsIgnoreCase(id)) {
                                      modelSpinner.setSelection(i);
                                      return;
                                  }
                              }
                              ids.add(id);
                              titles.add("➕ " + id);
                              descs.add("Space أضفته بنفسك");
                              saveCustom();
                              adapter.notifyDataSetChanged();
                              modelSpinner.setSelection(ids.size() - 1);
                          })
                          .setNegativeButton("إلغاء", null)
                          .show();
              }

              private void removeSelectedSpace() {
                  int pos = modelSpinner.getSelectedItemPosition();
                  if (pos < BUILTIN.length || pos >= ids.size()) return;
                  ids.remove(pos);
                  titles.remove(pos);
                  descs.remove(pos);
                  saveCustom();
                  adapter.notifyDataSetChanged();
                  modelSpinner.setSelection(0);
                  onModelSelected(0);
              }

              // ================================================================ image

              private void pickImage() {
                  Intent i = new Intent(Intent.ACTION_GET_CONTENT);
                  i.setType("image/*");
                  startActivityForResult(Intent.createChooser(i, "اختر صورة"), REQ_PICK);
              }

              @Override
              protected void onActivityResult(int req, int res, Intent data) {
                  super.onActivityResult(req, res, data);
                  if (req == REQ_PICK && res == RESULT_OK && data != null && data.getData() != null) {
                      loadImage(data.getData());
                  }
              }

              private void loadImage(Uri uri) {
                  try {
                      BitmapFactory.Options bounds = new BitmapFactory.Options();
                      bounds.inJustDecodeBounds = true;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          BitmapFactory.decodeStream(in, null, bounds);
                      }
                      int maxSide = Math.max(bounds.outWidth, bounds.outHeight);
                      int sample = 1;
                      while (maxSide / sample > 2048) sample *= 2;

                      BitmapFactory.Options opts = new BitmapFactory.Options();
                      opts.inSampleSize = sample;
                      Bitmap bmp;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          bmp = BitmapFactory.decodeStream(in, null, opts);
                      }
                      if (bmp == null) throw new IOException("تعذر قراءة الصورة");

                      int rot = 0;
                      try (InputStream in = getContentResolver().openInputStream(uri)) {
                          ExifInterface ex = new ExifInterface(in);
                          int ori = ex.getAttributeInt(ExifInterface.TAG_ORIENTATION,
                                  ExifInterface.ORIENTATION_NORMAL);
                          if (ori == ExifInterface.ORIENTATION_ROTATE_90) rot = 90;
                          else if (ori == ExifInterface.ORIENTATION_ROTATE_180) rot = 180;
                          else if (ori == ExifInterface.ORIENTATION_ROTATE_270) rot = 270;
                      } catch (Exception ignored) {
                          // no orientation info
                      }

                      Matrix m = new Matrix();
                      if (rot != 0) m.postRotate(rot);
                      float scale = Math.min(1f, 1024f / Math.max(bmp.getWidth(), bmp.getHeight()));
                      m.postScale(scale, scale);
                      Bitmap out = Bitmap.createBitmap(bmp, 0, 0, bmp.getWidth(), bmp.getHeight(), m, true);

                      ByteArrayOutputStream bo = new ByteArrayOutputStream();
                      out.compress(Bitmap.CompressFormat.JPEG, 90, bo);
                      imageBytes = bo.toByteArray();
                      preview.setImageBitmap(out);
                      preview.setVisibility(View.VISIBLE);
                      placeholder.setVisibility(View.GONE);
                  } catch (Exception e) {
                      toast("فشل تحميل الصورة: " + e.getMessage());
                  }
              }

              // ================================================================ generation

              private void setStatus(final String s) {
                  runOnUiThread(() -> {
                      statusText.setTextColor(Ui.TEXT);
                      statusText.setText(s);
                  });
              }

              private void setError(final String s) {
                  runOnUiThread(() -> {
                      statusText.setTextColor(Ui.ERR);
                      statusText.setText(s);
                  });
              }

              private void setBusy(final boolean busy) {
                  runOnUiThread(() -> {
                      genBtn.setEnabled(!busy);
                      genBtn.setAlpha(busy ? 0.5f : 1f);
                      progress.setVisibility(busy ? View.VISIBLE : View.GONE);
                      if (busy) {
                          statusCard.setVisibility(View.VISIBLE);
                          genStart = System.currentTimeMillis();
                          handler.removeCallbacks(ticker);
                          handler.post(ticker);
                      } else {
                          handler.removeCallbacks(ticker);
                      }
                  });
              }

              private void generate() {
                  final byte[] img = imageBytes;
                  if (img == null) {
                      toast("اختر صورة أولًا");
                      return;
                  }
                  int pos = modelSpinner.getSelectedItemPosition();
                  if (pos < 0 || pos >= ids.size()) return;
                  final String spaceId = ids.get(pos);
                  String p = promptEdit.getText().toString().trim();
                  final String prompt = p.isEmpty() ? DEFAULT_PROMPT : p;
                  final double duration = 2.0 + durationSeek.getProgress() / 10.0;
                  final String token = tokenEdit.getText().toString().trim();
                  prefs.edit().putString("token", token).apply();

                  resultCard.setVisibility(View.GONE);
                  savedUri = null;
                  setStatus("١/٤  جارٍ الاتصال بالنموذج...");
                  setBusy(true);

                  new Thread(() -> {
                      try {
                          GradioClient g = new GradioClient(spaceId, token);
                          g.loadEndpoint(this::setStatus);
                          setStatus("٢/٤  جارٍ رفع الصورة...");
                          String uploaded = g.upload(img);
                          setStatus("٣/٤  تم الرفع. في انتظار الخدمة المجانية (قد يطول الانتظار)...");
                          String eventId = g.submit(uploaded, prompt, duration);
                          String result = g.waitResult(eventId, this::setStatus);
                          setStatus("٤/٤  جارٍ تنزيل الفيديو...");
                          final File f = g.download(g.extractVideoUrl(result), new File(getCacheDir(), "result.mp4"));
                          resultFile = f;
                          runOnUiThread(() -> showVideo(f));
                      } catch (Exception e) {
                          setError("تعذّر التوليد:\n" + e.getMessage());
                      } finally {
                          setBusy(false);
                      }
                  }).start();
              }

              private void showVideo(File f) {
                  resultCard.setVisibility(View.VISIBLE);
                  videoView.setVideoPath(f.getAbsolutePath());
                  videoView.setOnPreparedListener(mp -> {
                      mp.setLooping(true);
                      videoView.start();
                  });
                  statusText.setTextColor(Ui.OK);
                  statusText.setText("✅ تم! الفيديو جاهز.");
              }

              // ================================================================ save / share

              private Uri saveToGallery() throws Exception {
                  if (savedUri != null) return savedUri;
                  if (resultFile == null) throw new IOException("لا يوجد فيديو");
                  ContentValues v = new ContentValues();
                  v.put(MediaStore.Video.Media.DISPLAY_NAME, "img2video_" + System.currentTimeMillis() + ".mp4");
                  v.put(MediaStore.Video.Media.MIME_TYPE, "video/mp4");
                  v.put(MediaStore.Video.Media.RELATIVE_PATH, "Movies/Img2Video");
                  v.put(MediaStore.Video.Media.IS_PENDING, 1);
                  Uri u = getContentResolver().insert(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, v);
                  if (u == null) throw new IOException("تعذر إنشاء الملف");
                  try (OutputStream os = getContentResolver().openOutputStream(u);
                       InputStream in = new FileInputStream(resultFile)) {
                      byte[] buf = new byte[16384];
                      int n;
                      while ((n = in.read(buf)) > 0) os.write(buf, 0, n);
                  }
                  ContentValues done = new ContentValues();
                  done.put(MediaStore.Video.Media.IS_PENDING, 0);
                  getContentResolver().update(u, done, null, null);
                  savedUri = u;
                  return u;
              }

              private void shareVideo() {
                  try {
                      Uri u = saveToGallery();
                      Intent s = new Intent(Intent.ACTION_SEND);
                      s.setType("video/mp4");
                      s.putExtra(Intent.EXTRA_STREAM, u);
                      s.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      startActivity(Intent.createChooser(s, "مشاركة الفيديو"));
                  } catch (Exception e) {
                      toast("تعذرت المشاركة: " + e.getMessage());
                  }
              }
          }
