name: Emulator Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Find project file
        run: |
          PROJ=$(find src -name '*.csproj' | head -n 1)
          echo "Using project: $PROJ"
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android

      - name: Install Android SDK components for build
        run: |
          dotnet build "$PROJ" -f net10.0-android \
            -t:InstallAndroidDependencies \
            -p:AndroidSdkDirectory="$HOME/android-sdk" \
            -p:AcceptAndroidSDKLicenses=True

      - name: Build x64 APK for emulator
        run: |
          dotnet publish "$PROJ" -f net10.0-android -c Release \
            -p:AndroidPackageFormat=apk \
            -p:RuntimeIdentifier=android-x64 \
            -p:PublishTrimmed=false \
            -p:RunAOTCompilation=false \
            -p:AndroidSdkDirectory="$HOME/android-sdk" \
            2>&1 | tee build.log

      - name: Collect APK
        run: |
          mkdir -p out
          APK=$(find src -path '*Release*' -name '*Signed.apk' | head -n 1)
          echo "APK: $APK"
          cp "$APK" out/app.apk
          ls -la out

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app in emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r out/app.apk
            adb logcat -c
            adb shell monkey -p com.mobilei2v.console -c android.intent.category.LAUNCHER 1
            sleep 30
            adb shell pidof com.mobilei2v.console > pid.txt || echo NOT_RUNNING > pid.txt
            adb logcat -d > logcat.txt
            adb logcat -d -s AndroidRuntime:E DOTNET:V monodroid:V mono-rt:V > crash.txt
            adb exec-out screencap -p > screen.png

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            pid.txt
            crash.txt
            logcat.txt
            screen.png
            build.log
